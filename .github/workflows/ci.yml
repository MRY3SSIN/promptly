name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml

      - name: Install
        working-directory: extension
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: extension
        run: pnpm run compile

      - name: Unit tests
        working-directory: extension
        run: pnpm run test

      - name: Install Chromium
        working-directory: extension
        run: pnpm exec playwright install --with-deps chromium

      # Builds the extension and the e2e harness, then runs both browser suites.
      # The 60-second anchoring soak is excluded here and run on a schedule.
      - name: End-to-end tests
        working-directory: extension
        run: pnpm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: extension/playwright-report/
