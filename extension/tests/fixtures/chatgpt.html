<!doctype html>
<!--
  chatgpt.com. OpenAI moved this composer from a <textarea> to ProseMirror
  without changing the element id, so `#prompt-textarea` still resolves and now
  means something different. The adapter detects the engine from the element
  rather than trusting the id, and this fixture is the shape that makes that
  matter.
-->
<html lang="en"><head><meta charset="utf-8"><title>ChatGPT fixture</title><style>
  *{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column;font-family:system-ui}
  main{flex:1 1 auto;overflow-y:auto;padding:20px}
  .composer-region{flex:0 0 auto;padding:12px 20px 24px}
  form{max-width:768px;margin:0 auto}
  .rounded{position:relative;border:1px solid #d9d9e3;border-radius:26px;padding:12px 52px 12px 16px;background:#fff}
  #prompt-textarea{min-height:24px;outline:none;max-height:200px;overflow-y:auto}
  .trailing{position:absolute;right:10px;bottom:8px;display:flex;gap:6px}
  .trailing button{width:32px;height:32px;border-radius:16px;border:0;background:#000;color:#fff}
</style></head><body>
  <main id="thread"><div id="filler"></div></main>
  <div class="composer-region"><form>
    <div class="rounded">
      <div id="prompt-textarea" class="ProseMirror" contenteditable="true" role="textbox"
           data-virtualkeyboard="true" translate="no"><p><br></p></div>
      <div class="trailing">
        <button type="button" aria-label="Upload files and more">+</button>
        <button type="button" data-testid="send-button" aria-label="Send prompt">&uarr;</button>
      </div>
    </div>
  </form></div>
  <script>
    const f=document.getElementById('filler');
    for(let i=0;i<30;i++){const d=document.createElement('div');d.style.margin='0 0 24px';
      d.textContent='Turn '+i+'. '+'Lorem ipsum dolor sit amet. '.repeat(8);f.appendChild(d);}
  </script>
</body></html>
