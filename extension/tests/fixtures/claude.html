<!doctype html>
<!--
  A structural snapshot of claude.ai's chat surface, reduced to the parts the
  adapter and the anchor engine actually care about:

    - a sticky header that can occlude the composer when it scrolls up
    - a scrollable transcript, so the composer has a scrolling ancestor
    - the composer inside `form > fieldset > wrapper > div.ProseMirror`,
      which is the nesting the selector chain walks
    - the site's own controls in the composer's bottom-right, which is
      exactly where we want to put the halo and therefore must not

  This fixture will rot — the site changes. That is expected, and the weekly
  selector-drift job is what makes the rot visible instead of silent.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Claude fixture</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: system-ui, sans-serif;
        background: #fbfaf8;
        color: #16181a;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      body[data-theme='dark'] { background: #16181a; color: #f2f0ed; }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        padding: 12px 20px;
        background: rgba(251, 250, 248, 0.92);
        border-bottom: 1px solid rgba(138, 143, 148, 0.24);
        flex: 0 0 auto;
      }
      body[data-theme='dark'] header { background: rgba(22, 24, 26, 0.92); }

      /* The transcript scrolls; the composer does not. */
      main#transcript {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 20px;
      }
      .msg { max-width: 720px; margin: 0 auto 28px; line-height: 1.6; }

      .composer-region { flex: 0 0 auto; padding: 12px 20px 24px; }
      form { max-width: 760px; margin: 0 auto; }
      fieldset {
        position: relative;
        margin: 0;
        padding: 12px 12px 48px;
        border: 1px solid rgba(138, 143, 148, 0.32);
        border-radius: 14px;
        background: #fff;
      }
      body[data-theme='dark'] fieldset { background: #1f2225; border-color: rgba(180,186,192,.2); }

      .composer-wrapper { max-height: 240px; overflow-y: auto; }
      div.ProseMirror {
        min-height: 24px;
        outline: none;
        font-size: 15px;
        line-height: 1.55;
      }
      div.ProseMirror p { margin: 0 0 8px; }

      .controls {
        position: absolute;
        right: 10px;
        bottom: 10px;
        display: flex;
        gap: 8px;
      }
      .controls button {
        width: 30px; height: 30px;
        border-radius: 8px;
        border: 1px solid rgba(138,143,148,.3);
        background: #f2f0ed;
        cursor: pointer;
      }

      /* Toggled by tests to simulate the site's own side panel opening. */
      body.sidebar-open .composer-region,
      body.sidebar-open main#transcript,
      body.sidebar-open header { margin-left: 280px; }
      #sidebar {
        position: fixed; left: 0; top: 0; bottom: 0; width: 280px;
        background: #efece7; display: none; z-index: 20;
      }
      body.sidebar-open #sidebar { display: block; }
    </style>
  </head>
  <body>
    <div id="sidebar"></div>

    <header><strong>Claude</strong></header>

    <main id="transcript">
      <div id="filler"></div>
    </main>

    <div class="composer-region">
      <form>
        <fieldset>
          <div class="composer-wrapper">
            <div
              class="ProseMirror"
              contenteditable="true"
              role="textbox"
              aria-label="Write your prompt to Claude"
              translate="no"
            ><p><br /></p></div>
          </div>
          <div class="controls">
            <button type="button" aria-label="Upload file">+</button>
            <button type="button" aria-label="Send message">&uarr;</button>
          </div>
        </fieldset>
      </form>
    </div>

    <script>
      // Enough transcript to make the main region genuinely scrollable.
      const filler = document.getElementById('filler');
      for (let i = 0; i < 40; i++) {
        const d = document.createElement('div');
        d.className = 'msg';
        d.textContent =
          'Message ' + i + '. ' + 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. '.repeat(6);
        filler.appendChild(d);
      }
    </script>
  </body>
</html>
